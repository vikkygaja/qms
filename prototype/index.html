<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QMS Hand Hygiene Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700&family=Public+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
/* Layout: app shell — dark left nav, top bar with role switcher, content area of cards; prototype banner on top */
:root{
  --bg:#f3f5f7; --surface:#ffffff; --ink:#13212d; --muted:#5b6a77; --line:#d9e1e7;
  --accent:#0a6a72; --accent-soft:#def0f1; --nav:#0f2733; --nav-ink:#c9dde1; --nav-act:#1c4352;
  --good:#1d7a45; --good-soft:#e2f2e7; --warn:#986100; --warn-soft:#faefd8; --bad:#b0281f; --bad-soft:#fbe4e1;
  --display:"Manrope",system-ui,sans-serif; --body:"Public Sans",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e171d; --surface:#152229; --ink:#e3edf0; --muted:#94a8b1; --line:#283a43;
  --accent:#4cbcc6; --accent-soft:#143a40; --nav:#0a1a21; --nav-ink:#a9c3c9; --nav-act:#173843;
  --good:#6fd296; --good-soft:#15331f; --warn:#efbb5a; --warn-soft:#382b12; --bad:#f2877d; --bad-soft:#3b1a17; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0e171d; --surface:#152229; --ink:#e3edf0; --muted:#94a8b1; --line:#283a43;
  --accent:#4cbcc6; --accent-soft:#143a40; --nav:#0a1a21; --nav-ink:#a9c3c9; --nav-act:#173843;
  --good:#6fd296; --good-soft:#15331f; --warn:#efbb5a; --warn-soft:#382b12; --bad:#f2877d; --bad-soft:#3b1a17; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--body)}
h1,h2,h3{font-family:var(--display);font-weight:700;margin:0;text-wrap:balance}
h1{font-size:1.35rem} h2{font-size:1.05rem} h3{font-size:.92rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.banner{background:var(--warn-soft);color:var(--warn);font-size:.82rem;padding:6px 16px;text-align:center;font-weight:600}
.app{display:grid;grid-template-columns:232px 1fr;min-height:calc(100% - 30px)}
@media (max-width:820px){.app{grid-template-columns:1fr}.nav{position:static!important;height:auto!important}}
.nav{background:var(--nav);color:var(--nav-ink);padding:16px 10px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.logo{font-family:var(--display);font-weight:700;font-size:1.15rem;color:#fff;padding:4px 10px 14px}
.logo small{display:block;font-family:var(--body);font-weight:400;font-size:.75rem;color:var(--nav-ink);opacity:.8}
.nav .grp{font-size:.7rem;letter-spacing:.06em;opacity:.65;padding:12px 10px 4px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;font-size:.9rem}
.nav button:hover{background:var(--nav-act)}
.nav button[aria-current=page]{background:var(--nav-act);color:#fff;font-weight:600}
.nav button:focus-visible{outline:2px solid var(--accent)}
.nav .sub{padding-left:22px;font-size:.86rem}
.nav .soon{cursor:default;opacity:.55}
.nav .soon:hover{background:none}
.tag{font-size:.65rem;border:1px solid currentColor;border-radius:99px;padding:0 6px;opacity:.8}
.main{display:flex;flex-direction:column;min-width:0}
.top{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line)}
.top .who{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bell{position:relative;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;cursor:pointer}
.bell b{position:absolute;top:-6px;right:-6px;background:var(--bad);color:#fff;font-size:.7rem;border-radius:99px;padding:0 6px}
.content{padding:20px;display:grid;gap:16px;max-width:1180px;width:100%}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;display:grid;gap:12px;min-width:0}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:.82rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile span{display:block;font-size:.78rem;color:var(--muted)}
.tile strong{font-family:var(--display);font-size:1.6rem;font-variant-numeric:tabular-nums}
.tile em{font-style:normal;font-size:.78rem}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px}
.btn{border:1px solid var(--accent);background:var(--accent);color:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:.82rem}
.btn.danger{border-color:var(--bad);background:transparent;color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
select,input[type=text],input[type=date],input[type=time],input[type=number],textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:7px 9px}
label.f{display:grid;gap:3px;font-size:.8rem;color:var(--muted);font-weight:600}
.pill{display:inline-block;border-radius:99px;padding:1px 9px;font-size:.75rem;font-weight:600}
.p-good{background:var(--good-soft);color:var(--good)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-n{background:var(--accent-soft);color:var(--accent)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.75rem;color:var(--muted);font-weight:600}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.bar{display:grid;grid-template-columns:150px 1fr 92px;gap:8px;align-items:center;font-size:.84rem;margin-bottom:5px}
.bar .tr{height:9px;background:var(--bg);border-radius:5px;overflow:hidden;position:relative}
.bar .fl{height:100%;border-radius:5px}
.bar .tg{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.45}
.bar em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.prog{height:8px;background:var(--bg);border-radius:5px;overflow:hidden;min-width:90px}
.prog i{display:block;height:100%;background:var(--accent)}
.mods{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.mod{border:1px solid var(--line);border-radius:10px;padding:12px;display:grid;gap:4px}
.mod.on{border-color:var(--accent);background:var(--accent-soft)}
.mod.off{opacity:.6}
.alert{border-left:4px solid var(--bad);background:var(--bad-soft);padding:8px 10px;border-radius:0 8px 8px 0;font-size:.86rem}
.alert.w{border-left-color:var(--warn);background:var(--warn-soft)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:3px 9px;cursor:pointer;font-size:.82rem;min-width:30px}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--surface)}
.seg button.m[aria-pressed=true]{background:var(--bad);border-color:var(--bad)}
.seg button:disabled{opacity:.35;cursor:not-allowed}
.erow:focus-within,.erow:focus{background:var(--accent-soft);outline:none}
.err{color:var(--bad);font-size:.82rem;margin:0}
.toast{position:sticky;bottom:12px;justify-self:center;background:var(--ink);color:var(--surface);padding:8px 14px;border-radius:8px;font-size:.88rem}
.toast[hidden]{display:none}
.panel{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--bg)}
.slides{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px}
.slide{aspect-ratio:16/9;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:14px;display:flex;flex-direction:column;gap:8px;overflow:hidden}
.slide h3{font-size:.95rem}
.slide .big{font-family:var(--display);font-size:2.4rem;font-weight:700;color:var(--accent)}
.slide .bar{grid-template-columns:110px 1fr 54px;font-size:.72rem;margin-bottom:3px}
.sheet{background:#fff;color:#111;border:1px solid #bbb;border-radius:6px;padding:18px;font-size:.78rem}
.sheet table th,.sheet table td{border:1px solid #999;padding:4px;color:#111}
.box{display:inline-block;width:11px;height:11px;border:1px solid #333;margin:0 2px -1px 6px}
.login{max-width:720px;margin:40px auto;display:grid;gap:16px;padding:0 16px}
.rolecards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.rolecards button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;cursor:pointer;display:grid;gap:4px}
.rolecards button:hover{border-color:var(--accent)}
svg text{fill:var(--muted);font-size:11px;font-family:var(--body)}
@media (prefers-reduced-motion:no-preference){.bar .fl,.prog i{transition:width .3s}}
.secret{border:1px solid var(--good);background:var(--good-soft);color:var(--ink);border-radius:10px;padding:12px;display:grid;gap:6px}
code{font-family:ui-monospace,Consolas,monospace;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 5px;font-size:.85em}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.checks{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:4px 12px;font-size:.88rem;margin:6px 0}
.checks label{display:flex;gap:6px;align-items:center}
.lbl{font-size:.8rem;color:var(--muted);font-weight:600}
.matrix .c{text-align:center}
.matrix input{width:18px;height:18px}
td.acts{white-space:nowrap}
.panel{display:grid;gap:10px}
</style>
</head>
<body>
<div class="banner">Clickable prototype · dummy data only · nothing is saved permanently</div>
<div id="root"></div>
<script>
// ---------- dummy data ----------
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(42);
const pick=a=>a[Math.floor(R()*a.length)];
const TODAY="2026-11-19";
let CATS=["Doctor","Nurse","Technician","Housekeeping","Student","Other HCW"].map(n=>({name:n,status:"Active"}));
const CATW=[.25,.40,.12,.12,.06,.05];
const CATMOD={Doctor:-.08,Nurse:.04,Technician:-.02,Housekeeping:-.10,Student:-.05,"Other HCW":-.06};
const MOMS=["1","2","3","4","5"];
const MOMNAME={"1":"Before patient contact","2":"Before aseptic procedure","3":"After body fluid exposure","4":"After patient contact","5":"After touching surroundings"};
const MOMMOD={"1":-.02,"2":.06,"3":.05,"4":.02,"5":-.10};
const MONTHS=[{key:"2026-09",label:"Sep 2026",m:8,days:30,mod:-.02},{key:"2026-10",label:"Oct 2026",m:9,days:31,mod:0},{key:"2026-11",label:"Nov 2026",m:10,days:19,mod:.02}];
const WARDS=[
["MICU",65,.86,"Critical Care"],["SICU",65,.84,"Critical Care"],["NICU",65,.92,"Critical Care"],["PICU",65,.90,"Critical Care"],["CCU",65,.85,"Critical Care"],["Emergency",70,.74,"Emergency"],["OT Complex",60,.88,"Surgery"],["Dialysis",40,.90,"Nephrology"],["Cath Lab",35,.87,"Cardiology"],
["Ward 1 – Medicine",50,.81,"Medicine"],["Ward 2 – Surgery",50,.79,"Surgery"],["Ward 3 – Ortho",50,.77,"Orthopaedics"],["Ward 4 – OBG",50,.86,"Women & Child"],["Ward 5 – Paediatrics",50,.88,"Women & Child"],["Ward 6 – Neuro",50,.80,"Neurology"],["Ward 7 – Cardiac",50,.83,"Cardiology"],["Ward 8 – Oncology",50,.82,"Oncology"],
["Private Ward A",30,.90,"Medicine"],["Private Ward B",30,.76,"Medicine"],["OPD",10,.70,"Outpatient"]].map((w,i)=>({id:i,name:w[0],target:w[1],base:w[2],dept:w[3],status:"Active"}));
let DEPTS=[...new Set(WARDS.map(w=>w.dept))].map(n=>({name:n,status:"Active"}));
const NAMES=["Priya R.","Kavitha S.","Anitha M.","Deepa K.","Lakshmi V.","Revathi P.","Sangeetha N.","Divya T.","Meena J.","Saranya B.","Gayathri L.","Nandhini A.","Suganya R.","Pavithra S.","Keerthana M.","Jothi K.","Vani P.","Malathi G.","Selvi D.","Bhuvana C.","Ramya H.","Sowmya E.","Indhu F.","Shalini Q.","Brindha U.","Vidhya Y.","Abirami O.","Kalaivani I.","Uma W.","Preethi Z."];
const SECOND=[0,1,5,6,9,10,11,12,13,14];
const genWard=i=>i<20?i:SECOND[i-20];
const NURSES=NAMES.map((n,i)=>({id:i,name:n,emp:"SN"+(1001+i),designation:i%3===0?"Sister":"Staff Nurse",dept:WARDS[genWard(i)].dept,mobile:"98400"+String(10000+i*137).slice(-5),email:"",from:"2026-01-05",training:"2026-01-10",status:"Active",pw:"demo1234",mustChange:false,statusLog:[]}));
let ASSIGN=NURSES.map(n=>({n:n.id,w:genWard(n.id),from:"2026-01-05",to:null}));
// demo history: Priya moved from Ward 2 to MICU in June, added SICU in Sept
ASSIGN[0]={n:0,w:10,from:"2026-01-05",to:"2026-05-31"};
ASSIGN.push({n:0,w:0,from:"2026-06-01",to:null},{n:0,w:1,from:"2026-09-01",to:null});
let SESSIONS=[],seq=1;
function catPick(){let r=R(),a=0;for(let i=0;i<CATW.length;i++){a+=CATW[i];if(r<a)return CATS[i].name}return "Nurse"}
const pad=n=>String(n).padStart(2,"0");
const genNurses=w=>NURSES.filter(n=>genWard(n.id)===w).map(n=>n.id);
MONTHS.forEach(mo=>{WARDS.forEach(w=>{
  let f=mo.key==="2026-11"?(19/30)*(.85+R()*.25):.9+R()*.2;let maxDay=mo.days;
  if(w.name==="Private Ward B"&&mo.key==="2026-11"){f=.15;maxDay=6}
  let total=Math.round(w.target*f);
  while(total>0){
    const size=Math.min(total,6+Math.floor(R()*7));total-=size;
    const day=1+Math.floor(R()*maxDay),h=8+Math.floor(R()*10),mi=Math.floor(R()*4)*15,dur=15+Math.floor(R()*11);
    const st=new Date(2026,mo.m,day,h,mi),en=new Date(st.getTime()+dur*60000);
    const opps=[];
    for(let k=0;k<size;k++){
      const cat=catPick();const mom=R()<.82?[pick(MOMS)]:[pick(MOMS),pick(MOMS)].filter((v,i,a)=>a.indexOf(v)===i).sort();
      const p=Math.max(.3,Math.min(.99,w.base+CATMOD[cat]+Math.min(...mom.map(x=>MOMMOD[x]))+mo.mod));
      const ok=R()<p;const act=ok?(R()<.75?"rub":"wash"):"missed";
      opps.push({cat,mom,act,gloves:act==="missed"?(R()<.4?"Y":"N"):(R()<.15?"Y":"N"),tech:act==="missed"?"NS":(R()<.86?"Y":"N")});
    }
    SESSIONS.push({id:"HH-"+mo.key.slice(2).replace("-","")+"-"+String(seq++).padStart(4,"0"),ward:w.id,obs:pick(genNurses(w.id)),date:`2026-${pad(mo.m+1)}-${pad(day)}`,start:`${pad(st.getHours())}:${pad(st.getMinutes())}`,end:`${pad(en.getHours())}:${pad(en.getMinutes())}`,status:(mo.key==="2026-11"&&day>=15)?"Submitted":"Reviewed",remarks:"",opps});
  }
})});
// demo: Preethi Z. inactive from 31 Oct
const PZ=NURSES[29];PZ.status="Inactive";PZ.statusLog.push({date:"2026-10-31",to:"Inactive",reason:"Moved to OT as scrub nurse",by:"Sr. Mary J."});
ASSIGN.find(a=>a.n===29).to="2026-10-31";
SESSIONS.forEach(s=>{if(s.obs===29&&s.date>"2026-10-31")s.obs=genWard(29)});
SESSIONS.sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start));
let STAFF=[{id:"u1",emp:"ADM001",name:"IT Admin",designation:"IT Manager",role:"admin",mobile:"9840000001",email:"",status:"Active",pw:"demo1234",mustChange:false},
 {id:"u2",emp:"ICN001",name:"Sr. Mary J.",designation:"Infection Control Nurse",role:"icn",mobile:"9840000002",email:"",status:"Active",pw:"demo1234",mustChange:false},
 {id:"u3",emp:"QM001",name:"Dr. Arun K.",designation:"Quality Manager",role:"qm",mobile:"9840000003",email:"",status:"Active",pw:"demo1234",mustChange:false}];
let SETTINGS={green:90,amber:80,inactiveDays:10};
let ROLES={admin:"Admin",icn:"ICN",qm:"Quality Manager",nurse:"Link nurse"};
const PERMS=[["masters","Manage masters (wards, departments, categories)"],["users","Manage users and roles (all)"],["ln","Manage link nurses (create login, wards, active/inactive)"],["record","Record hand hygiene sessions"],["review","Review / reject sessions"],["targets","Set ward targets"],["dash","View dashboards"],["alerts","Receive low-compliance alerts"],["reports","Reports and exports"]];
let ROLEPERM={admin:["masters","users","ln","targets","dash","reports"],icn:["ln","record","review","targets","dash","alerts","reports"],qm:["dash","alerts","reports"],nurse:["record","dash"]};
let AUDIT=[{t:"2026-10-31 16:10",by:"Sr. Mary J.",msg:"Set Preethi Z. (SN1030) Inactive: Moved to OT as scrub nurse"},{t:"2026-09-01 09:05",by:"Sr. Mary J.",msg:"Assigned SICU to Priya R. (SN1001)"}];

// ---------- state ----------
let S={role:null,view:"home",month:"2026-11",wardF:"all",open:null,rejecting:null,bell:false,draft:null,errors:[],
 lnForm:null,lnWards:null,lnStatus:null,lnFilter:{ward:"all",status:"Active",q:""},secret:null,uForm:null,uStatus:null,newRole:"",login:{u:"",p:"",err:""},pwUser:null,pwErr:"",mForm:null};
let ME=NURSES[0];

// ---------- helpers ----------
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"})[c]);
const wname=id=>WARDS[id].name;
const nname=id=>id===-1?"Sr. Mary J. (ICN)":NURSES[id].name;
const curWards=nid=>ASSIGN.filter(a=>a.n===nid&&!a.to).map(a=>a.w);
const wardNurses=w=>NURSES.filter(n=>n.status==="Active"&&ASSIGN.some(a=>a.n===n.id&&a.w===w&&!a.to));
const activeCats=()=>CATS.filter(c=>c.status==="Active").map(c=>c.name);
const activeWards=()=>WARDS.filter(w=>w.status==="Active");
const has=p=>(ROLEPERM[S.role]||[]).includes(p);
const myName=()=>S.role==="nurse"?ME.name:S.role==="icn"?"Sr. Mary J.":S.role==="qm"?"Dr. Arun K.":S.role==="admin"?"IT Admin":"User";
function log(msg){const d=new Date();AUDIT.unshift({t:`${TODAY} ${pad(d.getHours())}:${pad(d.getMinutes())}`,by:myName(),msg})}
function tempPw(){return "Tmp"+Math.floor(1000+Math.random()*9000)+"xyzk"[Math.floor(Math.random()*4)]}
function opsOf(list){return list.flatMap(s=>s.opps.map(o=>({...o,ward:s.ward,obs:s.obs,date:s.date})))}
function sessFor(month,ward){return SESSIONS.filter(s=>s.status!=="Rejected"&&(!month||s.date.startsWith(month))&&(ward==="all"||ward===undefined||(Array.isArray(ward)?ward.includes(s.ward):s.ward===+ward)))}
function kpi(o){const n=o.length,done=o.filter(x=>x.act!=="missed").length,miss=o.filter(x=>x.act==="missed"),comp=o.filter(x=>x.act!=="missed"&&x.tech!=="NS");
 return{n,done,miss:n-done,pct:n?Math.round(done/n*1000)/10:null,glv:miss.length?Math.round(miss.filter(x=>x.gloves==="Y").length/miss.length*100):null,tech:comp.length?Math.round(comp.filter(x=>x.tech==="Y").length/comp.length*100):null}}
const band=p=>p===null?"n":p>=SETTINGS.green?"good":p>=SETTINGS.amber?"warn":"bad";
const bcol=b=>({good:"var(--good)",warn:"var(--warn)",bad:"var(--bad)",n:"var(--line)"})[b];
const pill=p=>p===null?'<span class="pill p-n">—</span>':`<span class="pill p-${band(p)}">${p}%</span>`;
const spill=st=>`<span class="pill ${st==="Active"?"p-good":"p-bad"}">${st}</span>`;
function bars(groups,lw){return groups.map(g=>{const p=g.n?Math.round(g.done/g.n*1000)/10:null;return `<div class="bar" ${lw?`style="grid-template-columns:${lw}px 1fr 92px"`:""}><span>${g.label}</span><div class="tr"><div class="fl" style="width:${p??0}%;background:${bcol(band(p))}"></div><div class="tg" style="left:${SETTINGS.green}%"></div></div><em>${p===null?"—":p+"% · "+g.n}</em></div>`}).join("")}
function groupBy(o,key,labels){return labels.map(l=>{const r=o.filter(x=>key==="mom"?x.mom.includes(l.k):x[key]===l.k);return{label:l.l,n:r.length,done:r.filter(x=>x.act!=="missed").length}}).filter(g=>g.n)}
function wardGroups(month){return WARDS.map(w=>{const o=opsOf(sessFor(month,w.id));return{label:w.name,n:o.length,done:o.filter(x=>x.act!=="missed").length}}).filter(g=>g.n)}
function trendSvg(ward){const pts=MONTHS.map(m=>kpi(opsOf(sessFor(m.key,ward))).pct);const W=420,H=150,x=i=>50+i*150,y=v=>H-25-((v-60)/40)*(H-45);
 let s=`<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Compliance trend over three months">`;
 [60,70,80,90,100].forEach(v=>{s+=`<line x1="40" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="8" y="${y(v)+4}">${v}%</text>`});
 s+=`<line x1="40" x2="${W-10}" y1="${y(SETTINGS.green)}" y2="${y(SETTINGS.green)}" stroke="var(--good)" stroke-dasharray="4 4"/><text x="${W-80}" y="${y(SETTINGS.green)-5}">target ${SETTINGS.green}%</text>`;
 s+=`<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${pts.map((p,i)=>x(i)+","+y(p??60)).join(" ")}"/>`;
 pts.forEach((p,i)=>{s+=`<circle cx="${x(i)}" cy="${y(p??60)}" r="${i===2?5:4}" fill="var(--accent)"/><text x="${x(i)-14}" y="${y(p??60)-10}" style="fill:var(--ink);font-weight:600">${p??"—"}%</text><text x="${x(i)-22}" y="${H-6}">${MONTHS[i].label}</text>`});
 return s+"</svg>"}
function monthSel(){return `<label class="f">Month<select id="mSel">${MONTHS.map(m=>`<option value="${m.key}" ${m.key===S.month?"selected":""}>${m.label}${m.key==="2026-11"?" (to date)":""}</option>`).join("")}</select></label>`}
function wardSel(list,allLabel){return `<label class="f">Ward<select id="wSel"><option value="all">${allLabel}</option>${list.map(i=>`<option value="${i}" ${String(i)===String(S.wardF)?"selected":""}>${wname(i)}</option>`).join("")}</select></label>`}
function lastEntry(nid){return SESSIONS.filter(s=>s.obs===nid).map(s=>s.date).sort().pop()||"—"}
function alerts(){const a=[];
 activeWards().forEach(w=>{const k=kpi(opsOf(sessFor("2026-11",w.id)));if(k.n>=15&&k.pct<SETTINGS.amber)a.push({t:"bad",msg:`${w.name}: compliance ${k.pct}% this month (below ${SETTINGS.amber}%)`,to:"ICN + QM"})});
 activeWards().forEach(w=>{const n=opsOf(sessFor("2026-11",w.id)).length,exp=Math.round(w.target*19/30);if(n<exp*.6)a.push({t:"warn",msg:`${w.name}: ${n} of ~${exp} opportunities expected by today`,to:"ICN"})});
 NURSES.filter(n=>n.status==="Active").forEach(n=>{const last=lastEntry(n.id);if(last!=="—"&&(new Date(TODAY)-new Date(last))/864e5>SETTINGS.inactiveDays)a.push({t:"warn",msg:`${n.name} (${curWards(n.id).map(wname).join(", ")}): no entries since ${last}`,to:"ICN"})});
 return a}
let toastT;function toast(m){const t=$("toast");if(!t)return;t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,3000)}
function secretBox(){if(!S.secret)return "";return `<div class="secret"><strong>Login created for ${esc(S.secret.name)}</strong><span>Username: <code>${esc(S.secret.emp)}</code> · Temporary password: <code>${esc(S.secret.pw)}</code></span><span class="small">Shown once. The user must set a new password at first login.</span><div class="row"><button class="btn sm" data-copy="1">Copy</button><button class="btn ghost sm" data-secretx="1">Done</button></div></div>`}
function auditList(filter){const l=AUDIT.filter(a=>!filter||filter(a)).slice(0,8);return `<table><thead><tr><th>When</th><th>By</th><th>Action</th></tr></thead><tbody>${l.map(a=>`<tr><td class="small">${a.t}</td><td class="small">${esc(a.by)}</td><td class="small">${esc(a.msg)}</td></tr>`).join("")}</tbody></table>`}

document.addEventListener("click",e=>{
 const t=e.target.closest("button");if(!t)return;
 if(t.dataset.role){S.role=t.dataset.role;ME=NURSES[0];S.view="home";S.wardF="all";render();return}
 if(t.id==="loginBtn"){const u=$("lu").value.trim(),p=$("lp").value;S.login={u,p:"",err:""};
  const st=STAFF.find(x=>x.emp.toLowerCase()===u.toLowerCase()),ln=NURSES.find(x=>x.emp.toLowerCase()===u.toLowerCase());const usr=st||ln;
  if(!usr||usr.pw!==p){S.login.err="Employee ID or password is incorrect.";render();return}
  if(usr.status!=="Active"){S.login.err="This account is inactive. Contact the ICN or IT.";render();return}
  if(usr.mustChange){S.pwUser=usr;S.pwErr="";render();return}
  if(ln){ME=ln;S.role="nurse"}else S.role=st.role;S.view="home";S.wardF="all";render();return}
 if(t.id==="pwCancel"){S.pwUser=null;render();return}
 if(t.id==="pwSave"){const a=$("np1").value,b=$("np2").value;
  if(a.length<8||!/[a-z]/i.test(a)||!/\d/.test(a)){S.pwErr="Use at least 8 characters with letters and numbers.";render();return}
  if(a!==b){S.pwErr="The two passwords don't match.";render();return}
  const u=S.pwUser;u.pw=a;u.mustChange=false;S.pwUser=null;
  if(NURSES.includes(u)){ME=u;S.role="nurse"}else S.role=u.role;S.view="home";S.wardF="all";render();toast("Password set. Welcome!");return}
 if(t.dataset.nav){S.view=t.dataset.nav;S.open=null;S.rejecting=null;S.errors=[];S.wardF="all";S.lnForm=null;S.uForm=null;S.mForm=null;S.secret=null;render();window.scrollTo(0,0);return}
 if(t.id==="logout"){S.role=null;S.bell=false;S.draft=null;S.secret=null;S.login={u:"",p:"",err:""};render();return}
 if(t.id==="bellBtn"){S.bell=!S.bell;render();return}
 if(t.dataset.soon){toast(`${t.dataset.soon} is included in the pilot build.`);return}
 if(t.dataset.copy){navigator.clipboard?.writeText(`Username: ${S.secret.emp}  Temporary password: ${S.secret.pw}`).then(()=>toast("Copied."),()=>toast("Copy not allowed here; note it down."));return}
 if(t.dataset.secretx){S.secret=null;render();return}
 // sessions
 if(t.dataset.open){S.open=S.open===t.dataset.open?null:t.dataset.open;render();return}
 if(t.dataset.ok){const s=SESSIONS.find(x=>x.id===t.dataset.ok);s.status="Reviewed";log(`Reviewed session ${s.id}`);render();toast(`${s.id} marked reviewed.`);return}
 if(t.dataset.rej){S.rejecting=t.dataset.rej;render();$("rejReason")?.focus();return}
 if(t.dataset.rejx){S.rejecting=null;render();return}
 if(t.dataset.rejok){const r=$("rejReason").value.trim();if(!r){$("rejErr").textContent="Enter a reason before rejecting.";return}
  const s=SESSIONS.find(x=>x.id===t.dataset.rejok);s.status="Rejected";s.reason=r;log(`Rejected session ${s.id}: ${r}`);S.rejecting=null;render();toast(`${s.id} rejected. Excluded from KPIs.`);return}
 // link nurses
 if(t.dataset.lnadd){S.lnForm={mode:"add",v:{emp:"",name:"",designation:"Staff Nurse",dept:DEPTS[0].name,mobile:"",email:"",from:TODAY,training:"",wards:[]}};S.secret=null;S.lnWards=null;S.lnStatus=null;render();$("lf_emp")?.focus();return}
 if(t.dataset.lnedit){const n=NURSES[+t.dataset.lnedit];S.lnForm={mode:"edit",id:n.id,v:{...n,wards:curWards(n.id)}};S.lnWards=null;S.lnStatus=null;render();$("lf_name")?.focus();return}
 if(t.id==="lfCancel"){S.lnForm=null;render();return}
 if(t.id==="lfSave"){const f=S.lnForm;Object.assign(f.v,readForm("lf_",["emp","name","designation","dept","mobile","email","from","training"]));const v=f.v,er=[];
  if(!v.emp)er.push("Enter the employee ID.");else if(f.mode==="add"&&empTaken(v.emp))er.push("This employee ID already has a login.");
  if(!v.name)er.push("Enter the full name.");if(!/^\d{10}$/.test(v.mobile))er.push("Enter a 10-digit mobile number.");
  if(v.email&&!/^\S+@\S+\.\S+$/.test(v.email))er.push("Email looks incorrect.");if(!v.from)er.push("Enter the 'link nurse from' date.");
  if(f.mode==="add"&&!v.wards.length)er.push("Assign at least one ward.");
  if(er.length){f.err=er;render();return}
  if(f.mode==="add"){const pw=tempPw();const id=NURSES.length;
   NURSES.push({id,name:v.name,emp:v.emp.toUpperCase(),designation:v.designation,dept:v.dept,mobile:v.mobile,email:v.email,from:v.from,training:v.training,status:"Active",pw,mustChange:true,statusLog:[]});
   v.wards.forEach(w=>ASSIGN.push({n:id,w,from:v.from,to:null}));
   log(`Created link nurse ${v.name} (${v.emp.toUpperCase()}) and login; wards: ${v.wards.map(wname).join(", ")}`);
   S.secret={name:v.name,emp:v.emp.toUpperCase(),pw};S.lnForm=null;S.lnFilter.status="Active";render();toast("Link nurse and login created.");}
  else{const n=NURSES[f.id];["name","designation","dept","mobile","email","from","training"].forEach(k=>n[k]=v[k]);log(`Updated details of ${n.name} (${n.emp})`);S.lnForm=null;render();toast("Details saved.")}
  return}
 if(t.dataset.lnw){const id=+t.dataset.lnw;S.lnWards={id,sel:curWards(id)};S.lnForm=null;S.lnStatus=null;render();return}
 if(t.dataset.wx){S.lnWards=null;render();return}
 if(t.dataset.wok){const id=+t.dataset.wok,sel=S.lnWards.sel,cur=curWards(id);if(!sel.length){$("wErr").textContent="Keep at least one ward, or make the link nurse inactive instead.";return}
  const rem=cur.filter(w=>!sel.includes(w)),add=sel.filter(w=>!cur.includes(w));
  rem.forEach(w=>{ASSIGN.find(a=>a.n===id&&a.w===w&&!a.to).to=TODAY});add.forEach(w=>ASSIGN.push({n:id,w,from:TODAY,to:null}));
  if(add.length)log(`Assigned ${add.map(wname).join(", ")} to ${NURSES[id].name} (${NURSES[id].emp})`);if(rem.length)log(`Ended ${rem.map(wname).join(", ")} for ${NURSES[id].name} (${NURSES[id].emp})`);
  S.lnWards=null;render();toast(add.length||rem.length?"Ward assignment updated; history kept.":"No changes.");return}
 if(t.dataset.lnpw){const n=NURSES[+t.dataset.lnpw];const pw=tempPw();n.pw=pw;n.mustChange=true;log(`Reset password for ${n.name} (${n.emp})`);S.secret={name:n.name,emp:n.emp,pw};render();return}
 if(t.dataset.lnst){S.lnStatus=+t.dataset.lnst;S.lnWards=null;S.lnForm=null;render();$("stReason")?.focus();return}
 if(t.dataset.stx){S.lnStatus=null;render();return}
 if(t.dataset.stok){const n=NURSES[+t.dataset.stok];const r=$("stReason").value.trim(),d=$("stDate").value||TODAY;if(!r){$("stErr").textContent="Enter a reason.";return}
  const to=n.status==="Active"?"Inactive":"Active";n.status=to;n.statusLog.unshift({date:d,to,reason:r,by:myName()});
  if(to==="Inactive")ASSIGN.filter(a=>a.n===n.id&&!a.to).forEach(a=>a.to=d);
  log(`Set ${n.name} (${n.emp}) ${to}: ${r}`);S.lnStatus=null;render();toast(to==="Inactive"?"Made inactive. Login blocked; past records kept.":"Made active. Assign wards to resume entries.");return}
 // users
 if(t.dataset.uadd){S.uForm={mode:"add",v:{emp:"",name:"",designation:"",role:"icn",mobile:"",email:""}};S.secret=null;render();$("uf_emp")?.focus();return}
 if(t.dataset.uedit){const u=STAFF.find(x=>x.id===t.dataset.uedit);S.uForm={mode:"edit",id:u.id,v:{...u}};render();return}
 if(t.id==="ufCancel"){S.uForm=null;render();return}
 if(t.id==="ufSave"){const f=S.uForm;Object.assign(f.v,readForm("uf_",["emp","name","designation","role","mobile","email"]));const v=f.v,er=[];
  if(!v.emp)er.push("Enter the employee ID.");else if(f.mode==="add"&&empTaken(v.emp))er.push("This employee ID already has a login.");
  if(!v.name)er.push("Enter the full name.");if(!v.designation)er.push("Enter the designation.");if(!/^\d{10}$/.test(v.mobile))er.push("Enter a 10-digit mobile number.");
  if(er.length){f.err=er;render();return}
  if(f.mode==="add"){const pw=tempPw();STAFF.push({id:"u"+(STAFF.length+1),emp:v.emp.toUpperCase(),name:v.name,designation:v.designation,role:v.role,mobile:v.mobile,email:v.email,status:"Active",pw,mustChange:true});
   log(`Created user ${v.name} (${v.emp.toUpperCase()}) as ${ROLES[v.role]}`);S.secret={name:v.name,emp:v.emp.toUpperCase(),pw};}
  else{const u=STAFF.find(x=>x.id===f.id);const old=u.role;Object.assign(u,{name:v.name,designation:v.designation,role:v.role,mobile:v.mobile,email:v.email});log(`Updated user ${u.name} (${u.emp})${old!==v.role?`: role ${ROLES[old]} → ${ROLES[v.role]}`:""}`)}
  S.uForm=null;render();toast("Saved.");return}
 if(t.dataset.upw){const u=STAFF.find(x=>x.id===t.dataset.upw);const pw=tempPw();u.pw=pw;u.mustChange=true;log(`Reset password for ${u.name} (${u.emp})`);S.secret={name:u.name,emp:u.emp,pw};render();return}
 if(t.dataset.ust){S.uStatus=t.dataset.ust;render();$("uReason")?.focus();return}
 if(t.dataset.ux){S.uStatus=null;render();return}
 if(t.dataset.uok){const u=STAFF.find(x=>x.id===t.dataset.uok);const r=$("uReason").value.trim();if(!r){$("uErr").textContent="Enter a reason.";return}
  u.status=u.status==="Active"?"Inactive":"Active";log(`Set ${u.name} (${u.emp}) ${u.status}: ${r}`);S.uStatus=null;render();toast(`${u.name} is now ${u.status}.`);return}
 // roles
 if(t.id==="addRole"){const n=$("newRole").value.trim();if(!n){$("roleErr").textContent="Enter a role name.";return}
  const k="r_"+n.toLowerCase().replace(/[^a-z0-9]+/g,"_");if(ROLES[k]){$("roleErr").textContent="That role already exists.";return}
  ROLES[k]=n;ROLEPERM[k]=["dash"];S.newRole="";log(`Created role ${n}`);render();toast(`Role "${n}" added. Tick its permissions, then assign it to users.`);return}
 // masters
 if(t.dataset.madd){S.mForm={kind:t.dataset.madd};render();$("mName")?.focus();return}
 if(t.dataset.mx){S.mForm=null;render();return}
 if(t.dataset.msave){const k=t.dataset.msave,name=$("mName").value.trim();if(!name){$("mErr").textContent="Enter a name.";return}
  const list=k==="ward"?WARDS:k==="dept"?DEPTS:CATS;if(list.some(x=>x.name.toLowerCase()===name.toLowerCase())){$("mErr").textContent="That name already exists.";return}
  if(k==="ward")WARDS.push({id:WARDS.length,name,dept:$("mDept").value,target:Math.max(0,+$("mTgt").value||0),base:.85,status:"Active"});
  else list.push({name,status:"Active"});
  log(`Added ${k==="ward"?"ward":k==="dept"?"department":"staff category"} ${name}`);S.mForm=null;render();toast("Added.");return}
 if(t.dataset.mst){const[k,i]=t.dataset.mst.split(":");const it=(k==="ward"?WARDS:k==="dept"?DEPTS:CATS)[+i];
  if(k==="ward"&&it.status==="Active"&&wardNurses(it.id).length){toast(`Move this ward's link nurses first (${wardNurses(it.id).length} assigned).`);return}
  it.status=it.status==="Active"?"Inactive":"Active";log(`Set ${it.name} ${it.status}`);render();toast(`${it.name} is now ${it.status}.`);return}
 // session entry
 const d=S.draft;
 if(t.id==="addRow"){d.rows.push({cat:"Nurse",mom:[],act:"",gloves:"N",tech:""});render();document.querySelector(`[data-row="${d.rows.length-1}"]`)?.focus();return}
 if(t.dataset.dup!==undefined){const r=d.rows[+t.dataset.dup];d.rows.splice(+t.dataset.dup+1,0,JSON.parse(JSON.stringify(r)));render();return}
 if(t.dataset.del!==undefined){d.rows.splice(+t.dataset.del,1);render();return}
 const seg=t.closest(".seg");const row=t.closest("[data-row]");
 if(seg&&row&&d){const r=d.rows[+row.dataset.row],f=seg.dataset.f,v=t.dataset.v;
  if(f==="mom")r.mom=r.mom.includes(v)?r.mom.filter(x=>x!==v):[...r.mom,v].sort();
  else{r[f]=v;if(f==="act"){if(v==="missed")r.tech="NS";else if(r.tech==="NS"||!r.tech)r.tech="Y"}}
  S.errors=[];render();document.querySelector(`[data-row="${row.dataset.row}"] [data-f="${f}"] [data-v="${v}"]`)?.focus();return}
 if(t.id==="draftS"){toast("Draft kept for this session of the prototype.");return}
 if(t.id==="submitS"){const er=[];const [a,b]=d.start.split(":").map(Number),[c,f2]=d.end.split(":").map(Number);
  if(!d.rows.length)er.push("Add at least one opportunity.");
  if(c*60+f2<=a*60+b)er.push("End time must be after start time.");
  d.rows.forEach((r,i)=>{if(!r.mom.length)er.push(`Opportunity ${i+1}: choose at least one moment.`);if(!r.act)er.push(`Opportunity ${i+1}: choose an action.`)});
  if(er.length){S.errors=er;render();$("errs").scrollIntoView({block:"center"});return}
  const id="HH-2611-"+String(seq++).padStart(4,"0");
  SESSIONS.unshift({id,ward:+d.ward,obs:S.role==="nurse"?ME.id:-1,date:d.date,start:d.start,end:d.end,status:S.role==="icn"?"Reviewed":"Submitted",remarks:d.remarks,opps:d.rows.map(r=>({...r,tech:r.act==="missed"?"NS":r.tech}))});
  S.draft=null;S.errors=[];S.view="hh-sessions";S.month="2026-11";S.open=id;render();toast(`${id} submitted · ${kpi(SESSIONS[0].opps).pct}% compliance · dashboards updated.`);return}
});
document.addEventListener("change",e=>{const t=e.target;
 if(t.id==="roleSel"){S.role=t.value;ME=NURSES[0];S.view="home";S.wardF="all";S.bell=false;S.draft=null;render();return}
 if(t.id==="mSel"){S.month=t.value;render();return}
 if(t.id==="wSel"){S.wardF=t.value;render();return}
 if(t.id==="lnW"){S.lnFilter.ward=t.value;render();return}
 if(t.id==="lnS"){S.lnFilter.status=t.value;render();return}
 if(t.dataset.fw!==undefined&&S.lnForm){Object.assign(S.lnForm.v,readForm("lf_",["emp","name","designation","dept","mobile","email","from","training"]));const w=+t.dataset.fw,a=S.lnForm.v.wards;S.lnForm.v.wards=t.checked?[...a,w]:a.filter(x=>x!==w);return}
 if(t.dataset.wck!==undefined&&S.lnWards){const w=+t.dataset.wck,a=S.lnWards.sel;S.lnWards.sel=t.checked?[...a,w]:a.filter(x=>x!==w);return}
 if(t.dataset.perm){const p=t.dataset.perm,k=t.dataset.prole;ROLEPERM[k]=t.checked?[...ROLEPERM[k],p]:ROLEPERM[k].filter(x=>x!==p);log(`${t.checked?"Granted":"Removed"} "${PERMS.find(x=>x[0]===p)[1]}" ${t.checked?"to":"from"} ${ROLES[k]}`);toast("Permission updated.");return}
 if(t.dataset.tgt!==undefined){WARDS[+t.dataset.tgt].target=Math.max(0,+t.value||0);log(`Set ${wname(+t.dataset.tgt)} target to ${WARDS[+t.dataset.tgt].target}`);render();toast("Target updated.");return}
 if(["tG","tA","tI"].includes(t.id)){SETTINGS={green:+$("tG").value||90,amber:+$("tA").value||80,inactiveDays:+$("tI").value||10};render();toast("Settings updated.");return}
 const d=S.draft;if(!d)return;
 if(t.id==="dWard")d.ward=+t.value;if(t.id==="dDate")d.date=t.value;if(t.id==="dStart")d.start=t.value;if(t.id==="dEnd")d.end=t.value;
 if(t.dataset.f==="cat"){d.rows[+t.closest("[data-row]").dataset.row].cat=t.value}
 if(["dStart","dEnd"].includes(t.id))render();
});
document.addEventListener("input",e=>{const t=e.target;if(t.id==="dRem"&&S.draft)S.draft.remarks=t.value;if(t.id==="newRole")S.newRole=t.value;
 if(t.id==="lnQ"){S.lnFilter.q=t.value;const pos=t.selectionStart;render();const q=$("lnQ");q.focus();q.setSelectionRange(pos,pos)}});
document.addEventListener("keydown",e=>{
 if(e.key==="Enter"&&(e.target.id==="lu"||e.target.id==="lp")){$("loginBtn").click();return}
 const row=e.target.closest&&e.target.closest("[data-row]");if(!row||!S.draft)return;
 if(["SELECT","INPUT","TEXTAREA"].includes(e.target.tagName))return;
 const i=+row.dataset.row,r=S.draft.rows[i],k=e.key.toLowerCase();let hit=true;
 if(k==="r"){r.act="rub";if(r.tech==="NS"||!r.tech)r.tech="Y"}else if(k==="w"){r.act="wash";if(r.tech==="NS"||!r.tech)r.tech="Y"}else if(k==="m"){r.act="missed";r.tech="NS"}
 else if("12345".includes(k)&&k.length===1){r.mom=r.mom.includes(k)?r.mom.filter(x=>x!==k):[...r.mom,k].sort()}
 else if(k==="d"){S.draft.rows.splice(i+1,0,JSON.parse(JSON.stringify(r)))}else hit=false;
 if(hit){e.preventDefault();render();document.querySelector(`[data-row="${k==="d"?i+1:i}"]`)?.focus()}});
render();

</script>
</body>
